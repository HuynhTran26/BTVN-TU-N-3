
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 7 - Layout</title>

    <style>
        #wrapper {
            width: 500px;
            margin: 0 auto;
            padding: 5px;
            border: 2px solid black;
        }

        .wrapper-title {
            width: 500px;
            margin: 20px auto 5px;
        }

        header {
            height: 70px;
            border: 2px solid black;
            margin-bottom: 5px;
        }

        nav {
            width: 80px;
            height: 175px;
            border: 2px solid black;
            float: left;
            margin-right: 5px;
        }

        main {
            height: 175px;
            border: 2px solid black;
            overflow: hidden;
        }

        footer {
            height: 30px;
            border: 2px solid black;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <p class="wrapper-title">wrapper</p>

    <div id="wrapper">

        <header>
            header
        </header>

        <nav>
            nav
        </nav>

        <main>
            main
        </main>

        <footer>
            footer
        </footer>

    </div>

</body>
</html>
