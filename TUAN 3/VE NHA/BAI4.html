
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập HTML CSS</title>

    <style>
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: inline-block;
            margin-right: 5px;
        }

        a {
            display: inline-block;
            background-color: #00e5eb;
            color: blue;
            padding: 2px 20px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
